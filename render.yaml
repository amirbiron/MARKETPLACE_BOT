services:
  # ==================== Telegram Bot ====================
  - type: worker
    name: marketplace-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: marketplace_bot
      - key: ADMIN_IDS
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.10

  # ==================== Web App (Mini App) ====================
  - type: web
    name: marketplace-webapp
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn webapp_api:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: marketplace_bot
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.10
    healthCheckPath: /api/health
